# Автодеплой на сервер через self-hosted runner.
# Runner ставьте НА Linux-сервере с /var/www/inventory-accounting
# (это git-clone того же репозитория).
#
# Регистрация: Settings → Actions → Runners → New self-hosted runner
# Токен в командах GitHub живёт ~1 час — выполнять сразу после копирования.

name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20

    env:
      APP_DIR: /var/www/inventory-accounting
      WEB_USER: www-data
      WEB_GROUP: www-data
      DEPLOY_BRANCH: main

    steps:
      - name: Check app directory
        run: |
          set -euo pipefail
          test -d "$APP_DIR" || { echo "Нет каталога $APP_DIR"; exit 1; }
          test -d "$APP_DIR/.git" || { echo "В $APP_DIR нет .git — сделайте clone репозитория сюда"; exit 1; }

      - name: Pull latest main
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          git fetch origin --prune
          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"
          echo "Commit: $(git rev-parse --short HEAD)"

      - name: Composer install
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          if command -v composer >/dev/null 2>&1; then
            composer install --no-dev --optimize-autoloader --no-interaction
          elif [[ -f composer.phar ]]; then
            php composer.phar install --no-dev --optimize-autoloader --no-interaction
          else
            echo "WARNING: composer не найден"
          fi

      - name: Permissions (.env не затираем)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          mkdir -p src/storage/logs
          chown -R "${WEB_USER}:${WEB_GROUP}" .
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;
          chmod 775 src/storage/logs || true
          chmod +x scripts/*.sh 2>/dev/null || true
          if [[ -f .env ]]; then
            chmod 640 .env
            chown "${WEB_USER}:${WEB_GROUP}" .env
          else
            echo "::warning::Нет .env — создайте из .env.example (только DB_*_SQL)"
          fi

      - name: Write deploy stamp + log
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          STAMP="$(date '+%Y-%m-%dT%H:%M:%S%z') $(git rev-parse --short HEAD)"
          echo "$STAMP" > DEPLOY_STAMP.txt
          mkdir -p src/storage/logs
          echo "$(date '+%Y-%m-%d %H:%M:%S %z') OK $STAMP" >> src/storage/logs/deploy.log
          chown "${WEB_USER}:${WEB_GROUP}" DEPLOY_STAMP.txt src/storage/logs/deploy.log || true

      - name: Smoke check
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          php -r "require 'setting.php'; echo 'setting.php OK', PHP_EOL;" \
            || echo "::warning::setting.php не загрузился — проверьте .env / расширения PHP"
